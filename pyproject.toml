[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "esheep"
version = "0.1.0"
description = "A cross-platform port of eSheep, the classic desktop pet"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.10"
authors = [{ name = "Aayaan Jain Singal" }]
dependencies = [
    "PySide6>=6.6",
    "pyobjc-framework-Quartz>=10; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
    "python-xlib>=0.33; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10", "pillow>=10"]

[project.gui-scripts]
esheep = "esheep.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
esheep = ["pets/*/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
