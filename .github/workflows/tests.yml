# Quick checks on every push and pull request (~1-2 minutes per OS).
# The heavier app builds live in release.yml and only run for version tags.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen      # no real display on CI machines
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Install eSheep
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Check this OS's window backend imports
        run: python -c "from esheep.desktop import create_backend; print(type(create_backend()).__name__)"
