# Builds the downloadable apps. Runs only when you push a version tag, e.g.:
#
#     git tag v0.1.0 && git push origin v0.1.0
#
# The tag must match __version__ in src/esheep/__init__.py. You can also start
# it by hand from the Actions tab ("Run workflow") to get test builds as
# downloadable artifacts without publishing a release.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest          # Apple Silicon
          # Intel Macs. GitHub's last Intel runner (supported until ~fall 2027).
          # Marked optional so that once it's retired, releases still publish
          # everything else; then simply delete these two lines.
          - os: macos-15-intel
            optional: true
          - os: windows-latest
          - os: ubuntu-22.04          # older glibc = runs on more Linux distributions
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional == true }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: >
          sudo apt-get update && sudo apt-get install -y
          libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3
          libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0

      - name: Install eSheep and build tools
        run: pip install -e ".[dev,build]"

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version=$(python -c "import esheep; print(esheep.__version__)")
          if [ "${GITHUB_REF_NAME#v}" != "$package_version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match __version__ $package_version" >&2
            exit 1
          fi

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest

      - name: Build app
        run: python packaging/build.py

      - uses: actions/upload-artifact@v4
        with:
          name: esheep-${{ matrix.os }}
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write                 # needed to create the GitHub Release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
